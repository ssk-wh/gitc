name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Ensure release exists
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "gitc $RELEASE_TAG" --notes "gitc $RELEASE_TAG"
      - name: Prefer master branch
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          # 尽力把默认分支改为 master；GITHUB_TOKEN 无 admin 权限时会失败，忽略即可
          gh api -X PATCH "repos/$GH_REPO" -f default_branch=master >/dev/null 2>&1 || echo "默认分支切换需要仓库管理员在网页设置中完成"
          def="$(gh api "repos/$GH_REPO" --jq .default_branch 2>/dev/null || true)"
          if [ "$def" = "master" ]; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/main" >/dev/null 2>&1 || true
            echo "已删除远端 main 分支"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/gitc-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "$out" .
          ls -lh dist
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: gitc ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true

  checksums:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist --pattern 'gitc-*' --clobber
          cd dist
          sha256sum gitc-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
